
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  customer-profile:
    build:
      context: ./services/customer_profile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./services/customer_profile:/app
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  feedback-ingestion:
    build:
      context: ./services/feedback_ingestion
    environment:
      DATABASE_URL: sqlite:////data/feedback.db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CUSTOMER_PROFILE_URL: http://customer-profile:8001
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - feedback_data:/data
    depends_on:
      customer-profile:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  sentiment-analysis:
    build:
      context: ./services/sentiment_analysis
    environment:
      DATABASE_URL: sqlite:////data/sentiment.db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - sentiment_data:/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  churn-prediction:
    build:
      context: ./services/churn_prediction
    environment:
      MODEL_PATH: /models/churn_model.joblib
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - ./services/churn_prediction/model:/models:ro
    restart: unless-stopped

  retention:
    build:
      context: ./services/retention
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    build:
      context: ./services/retention
    command: ["python", "-m", "app.notification_worker"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  feedback_data:
  sentiment_data:
